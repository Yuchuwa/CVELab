name: Test Suite

on:
  push:
    branches: [ master, main, develop, dev ]
  pull_request:
    branches: [ master, main, develop, dev ]

jobs:
  non-docker-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/0.5.0/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Run active non-Docker tests
      run: |
        uv run pytest -q --no-cov \
          tests/shared tests/atomizer tests/orchestrator \
          -m "not docker and not slow"

  build-and-package:
    runs-on: ubuntu-latest
    needs: non-docker-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/0.5.0/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: uv sync --group dev

    - name: Build package
      run: |
        uv build

    - name: Check package
      run: |
        uv run python -c "import clab_builder; print(clab_builder.__version__)"
