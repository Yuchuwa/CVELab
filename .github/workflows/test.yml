name: Test Suite

on:
  push:
    branches: [ master, main, develop, dev ]
  pull_request:
    branches: [ master, main, develop, dev ]

permissions:
  contents: read

jobs:
  contract-gates:
    name: Fast contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install development dependencies
      run: uv sync --locked --group dev

    - name: Check Atom status freshness
      run: uv run python scripts/generate_atom_pool_status.py --check

    - name: Check tracked status contracts
      run: uv run python scripts/tests/check_status_contracts.py

    - name: Check documentation and workflow contracts
      run: uv run python scripts/tests/check_docs_contracts.py

    - name: Run focused contract tests
      run: |
        uv run pytest -q --no-cov \
          tests/shared/test_artifact_contracts.py \
          tests/shared/test_atom_pool_status.py \
          tests/orchestrator/test_guided_batch_runner.py

  non-docker-tests:
    needs: contract-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install development dependencies
      run: uv sync --locked --group dev

    - name: Run active non-Docker tests
      run: |
        uv run pytest -q --no-cov \
          tests/shared tests/atomizer tests/orchestrator tests/sft \
          -m "not docker and not slow"

  build-and-package:
    runs-on: ubuntu-latest
    needs: non-docker-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install development dependencies
      run: uv sync --locked --group dev

    - name: Build package
      run: |
        uv build

    - name: Check package
      run: |
        uv run python -c "import clab_builder; print(clab_builder.__version__)"
