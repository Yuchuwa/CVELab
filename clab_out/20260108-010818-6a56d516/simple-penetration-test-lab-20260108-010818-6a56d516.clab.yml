name: simple-penetration-test-lab-20260108-010818-6a56d516
topology:
  nodes:
    fake-node:
      kind: linux
      image: alpine:latest
      exec:
      - apk update
      - apk add iproute2 iputils busybox-extras
      - ip addr add 10.0.0.64/24 dev eth1
      - ip route replace default via 10.0.0.1
    ubuntu-server:
      kind: linux
      image: ubuntu:latest
      exec:
      - apt-get update
      - apt-get install -y iproute2 iputils-ping net-tools
      - ip addr add 10.0.0.65/24 dev eth1
      - ip route replace default via 10.0.0.1
    router:
      kind: linux
      image: alpine:latest
      exec:
      - apk update
      - apk add iproute2 iputils busybox-extras
      - ip addr add 10.0.0.1/24 dev eth1
      sysctls:
        net.ipv4.ip_forward: '1'
    sw-internal:
      kind: linux
      image: alpine:latest
      sysctls:
        net.ipv4.ip_forward: '1'
      exec:
      - apk update
      - apk add bridge-utils iproute2 iputils busybox-extras
      - brctl addbr br0
      - ip link set dev br0 up
      - brctl addif br0 eth1 && ip link set dev eth1 up
      - brctl addif br0 eth2 && ip link set dev eth2 up
      - brctl addif br0 eth3 && ip link set dev eth3 up
      - ip addr add 10.0.0.2/24 dev br0
  links:
  - endpoints:
    - fake-node:eth1
    - sw-internal:eth1
  - endpoints:
    - ubuntu-server:eth1
    - sw-internal:eth2
  - endpoints:
    - router:eth1
    - sw-internal:eth3
