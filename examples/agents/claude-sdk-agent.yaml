agent:
  name: claude-sdk-agent
  command: python3 /workspace/claude-sdk-benchmark-agent.py
  workdir: /workspace
  task_view: entry_ip
  files:
    - source: examples/agents/claude-sdk-benchmark-agent.py
      target: /workspace/claude-sdk-benchmark-agent.py
  env_from_host:
    - ANTHROPIC_API_KEY
    - ANTHROPIC_BASE_URL
    - LLM_API_KEY
    - LLM_BASE_URL
    - MODEL
    - LLM_MODEL
  env:
    CLAUDE_CONFIG_DIR: /workspace/.claude
    MAX_TURNS: "80"
  timeout_seconds: 1800
  output_contract:
    type: flags_json
    path: /tmp/cvelab_agent_output.json
