name: pentest-mvp-lab
topology:
  nodes:
    # 1. 攻击机
    attacker:
      kind: linux
      image: kalilinux/kali-rolling:latest
      exec:
      - ip addr add 10.0.0.2/24 dev eth1
      - ip route del default
      - ip route add default via 10.0.0.1
      # 可选：显式添加去往内网的路由
      - ip route add 192.168.10.0/24 via 10.0.0.1

    # 2. 核心路由器 (Core)
    core-router:
      kind: linux
      image: alpine:latest
      sysctls:
        net.ipv4.ip_forward: '1'
      exec:
      - ip addr add 172.16.0.2/24 dev eth1     # 连接 Edge
      - ip addr add 192.168.10.1/24 dev eth2   # 内网网关
      # 【修复】之前这里重复了两行 ip addr add ... dev eth2，会导致报错
      # 【新增】必须配置回程路由，否则攻击者的包回不来
      - ip route add 10.0.0.0/24 via 172.16.0.1

    # 3. 边界路由器 (Edge)
    edge-router:
      kind: linux
      image: alpine:latest
      sysctls:
        net.ipv4.ip_forward: '1'
      exec:
      - ip addr add 10.0.0.1/24 dev eth1       # 连接 Attacker
      - ip addr add 172.16.0.1/24 dev eth2     # 连接 Core
      # 【新增】必须配置去往内网的路由，否则包发不过去
      - ip route add 192.168.10.0/24 via 172.16.0.2

    # 4. 靶机 Log4j
    log4j-target:
      kind: linux
      image: vulfocus/log4j2-rce-2021-12-09:latest
      exec:
      - ip addr add 192.168.10.10/24 dev eth1
      - ip route del default
      - ip route add default via 192.168.10.1

    # 5. 靶机 Redis
    redis-server:
      kind: linux
      image: redis:7-alpine
      exec:
      - ip addr add 192.168.10.20/24 dev eth1
      - ip route del default
      - ip route add default via 192.168.10.1

    # 6. 交换机 (Bridge)
    switch:
      kind: linux
      image: alpine:latest
      # 开启转发（虽然对纯二层交换不是必须的，但作为网络设备是个好习惯）
      sysctls:
        net.ipv4.ip_forward: '1'
      exec:
        # 1. 安装网桥工具 (Alpine 默认可能不带)
        - apk add --no-cache bridge-utils
        # 2. 创建一个网桥设备 br0
        - brctl addbr br0
        # 3. 把插在这个容器上的网口全部“绑”到网桥上
        #    注意：Containerlab 会按连接顺序创建 eth1, eth2, eth3...
        - brctl addif br0 eth1
        - brctl addif br0 eth2
        - brctl addif br0 eth3
        # 4. 启动网桥和接口
        - ip link set dev br0 up
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip link set dev eth3 up

  links:
  # Attacker <-> Edge
  - endpoints:
    - attacker:eth1
    - edge-router:eth1
  
  # Edge <-> Core
  - endpoints:
    - edge-router:eth2
    - core-router:eth1
  
  # Core <-> Switch (Trunk)
  - endpoints:
    - core-router:eth2
    - switch:eth1
  
  # Switch 分发给靶机
  - endpoints:
    - switch:eth2
    - log4j-target:eth1
  - endpoints:
    - switch:eth3
    - redis-server:eth1