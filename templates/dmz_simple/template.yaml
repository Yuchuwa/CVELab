name: dmz_simple
description: "单层 DMZ 网络，attacker 直连目标区域"
difficulty: easy

transits:
  - subnet: "10.255.255.0/30"
    endpoints: [attacker, edge-router]

zones:
  dmz: {subnet: "192.168.100.0/24", type: dmz, router: edge-router}

routers:
  edge-router: {image: frrouting/frr:latest, connects: [attacker, dmz]}

isolation_rules:
  - {from: attacker, to: dmz, action: accept}

noise_levels:
  none: []
  low:
    - {name: decoy-dmz-nginx, zone: dmz, image: nginx:alpine, ports: [80]}
    - {name: decoy-dmz-redis, zone: dmz, image: redis:7.4-alpine, ports: [6379]}
  high:
    - {name: decoy-dmz-nginx, zone: dmz, image: nginx:alpine, ports: [80]}
    - {name: decoy-dmz-redis, zone: dmz, image: redis:7.4-alpine, ports: [6379]}
    - {name: decoy-dmz-mysql, zone: dmz, image: alpine:latest, ports: [3306],
       command: "nc -lk -p 3306 -e /bin/true"}
    - {name: decoy-dmz-ssh, zone: dmz, image: alpine:latest, ports: [22],
       command: "nc -lk -p 22 -e /bin/true"}
    - {name: decoy-dmz-busybox, zone: dmz, image: busybox:latest, ports: [8080],
       command: "httpd -f -p 8080"}

injection_points:
  - id: dmz-target-1
    zone: dmz
    role_description: "面向攻击者的目标服务"
    required_mitre: [initial_access, execution]
    required_vuln_category: [RCE, LFI, SSRF, Deserialization, Auth_Bypass, Info_Leak]
    required_service_role: [web_application, middleware, framework, database, system_service, file_service]
    count: 1
