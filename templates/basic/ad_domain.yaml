# Active Directory 域渗透环境 - Zerologon + 其他AD漏洞
name: ad-domain-lab

topology:
  nodes:
    # 攻击者
    attacker:
      kind: linux
      image: kalilinux/kali-rolling:latest
      labels:
        group: attackers
        role: primary_attacker

    # 边界设备
    firewall:
      kind: linux
      image: frrouting/frr:latest
      labels:
        group: network_infrastructure
        role: firewall
        firewall_rules: strict
      sysctls:
        net.ipv4.ip_forward: 1

    # ====== AD域组件 ======
    # 域控制器 - 主要漏洞目标
    domain-controller:
      kind: linux
      image: vulhub/ad:latest
      labels:
        group: domain_controllers
        role: primary_domain_controller
        cve_id: CVE-2020-1472  # Zerologon
        attack_vector: smb
        privilege_escalation: domain_admin
        domain_name: corp.local
        startup_priority: 1
        exposed_ports: [53, 88, 389, 445, 636]
      ports:
        - 445/tcp
        - 88/tcp
        - 389/tcp

    # 辅助域控制器
    secondary-dc:
      kind: linux
      image: vulhub/ad:latest
      labels:
        group: domain_controllers
        role: secondary_domain_controller
        domain_name: corp.local
        startup_priority: 2
        exposed_ports: [53, 88, 389, 445]
      ports:
        - 445/tcp
        - 88/tcp

    # 域成员服务器：Web服务器
    web-server:
      kind: linux
      image: vulhub/iis:latest
      labels:
        group: domain_members
        role: web_server
        domain_joined: true
        domain_name: corp.local
        computer_account: WEBSERVER$
        cve_id: CVE-2017-7269  # WebDAV RCE
        attack_surface: http
        exposed_ports: [80, 443]
      ports:
        - 80/tcp
        - 443/tcp

    # 域成员服务器：文件服务器
    file-server:
      kind: linux
      image: vulhub/samba:latest
      labels:
        group: domain_members
        role: file_server
        domain_joined: true
        domain_name: corp.local
        computer_account: FILESERVER$
        sensitive_data: true
        exposed_ports: [445, 139]
      ports:
        - 445/tcp
        - 139/tcp

    # 域内客户端
    domain-client:
      kind: linux
      image: ubuntu:latest
      labels:
        group: domain_clients
        role: corporate_workstation
        domain_joined: true
        domain_user: bob
        user_privileges: standard

  links:
    # 攻击者到防火墙
    - endpoints: ["attacker:eth1", "firewall:eth1"]

    # 防火墙到DMZ
    - endpoints: ["firewall:eth2", "web-server:eth1"]

    # 防火墙到内部网络
    - endpoints: ["firewall:eth3", "domain-controller:eth1"]

    # 域控制器连接
    - endpoints: ["domain-controller:eth2", "secondary-dc:eth1"]

    # 域成员连接（修复接口冲突）
    - endpoints: ["domain-controller:eth3", "secondary-dc:eth2"]
    - endpoints: ["domain-controller:eth4", "file-server:eth1"]
    - endpoints: ["domain-controller:eth5", "domain-client:eth1"]