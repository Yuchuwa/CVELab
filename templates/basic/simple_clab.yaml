# 简单的ContainerLab标准格式拓扑
name: simple-test-lab

topology:
  nodes:
    # 攻击者
    attacker:
      kind: linux
      image: kalilinux/kali-rolling:latest
      labels:
        role: attacker

    # 边界路由器
    edge-router:
      kind: linux
      image: frrouting/frr:latest
      labels:
        role: router
        routing: ospf
      sysctls:
        net.ipv4.ip_forward: 1

    # Web服务器 - 漏洞目标
    web-server:
      kind: linux
      image: nginx:latest
      labels:
        role: vuln-target
        cve: CVE-2013-2028
      ports:
        - 80/tcp
        - 443/tcp

  links:
    # 攻击者连接到边界路由器
    - endpoints: ["attacker:eth1", "edge-router:eth1"]
    # 边界路由器连接到Web服务器
    - endpoints: ["edge-router:eth2", "web-server:eth1"]