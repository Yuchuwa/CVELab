# 多节点CVE场景 + 多层网络架构
name: complex-pentest-lab

# 企业网络层架构
topology:
  networks:
    external:
      description: "外部网络 - 攻击者位置"
    dmz:
      description: "DMZ区域 - 公开服务"
    internal:
      description: "内部网络 - 核心资产"

  nodes:
    # 攻击者
    attacker:
      kind: linux
      image: kalilinux/kali-rolling:latest
      labels:
        role: attacker
        network_layer: external

    # 边界路由器
    edge-router:
      kind: linux
      image: frrouting/frr:latest
      labels:
        role: router
        network_layer: [dmz, external]
        routing: ospf
      sysctls:
        net.ipv4.ip_forward: 1

    # ====== DMZ区域：Log4j CVE场景 ======
    # 这个场景包含3个节点，但对外表现为一个攻击面
    unifi-controller:
      kind: linux
      image: vulhub/log4j:latest
      labels:
        # CVE场景标识
        cve_group: log4j-unifi-scenario
        role_in_group: primary_target
        network_layer: dmz
        # 依赖关系
        depends_on: [mongodb, ldap-server]
        startup_order: 3  # 最后启动
        # 漏洞信息
        vulnerability:
          cve: CVE-2021-44228
          attack_surface: https
          exploitation_port: 8443
      ports:
        - 8443/tcp
        - 8080/tcp

    mongodb:
      kind: linux
      image: mongo:latest
      labels:
        cve_group: log4j-unifi-scenario
        role_in_group: dependency
        network_layer: dmz
        startup_order: 1  # 最先启动
        service_type: database

    ldap-server:
      kind: linux
      image: openldap:latest
      labels:
        cve_group: log4j-unifi-scenario
        role_in_group: infrastructure
        network_layer: dmz
        startup_order: 2
        service_type: authentication
      ports:
        - 389/tcp
        - 636/tcp

    # ====== Internal区域：AD域控制器 ======
    domain-controller:
      kind: linux
      image: vulhub/ad:latest
      labels:
        role: vulnerability
        network_layer: internal
        vulnerability:
          cve: CVE-2020-1472  # Zerologon
          attack_surface: smb
          privilege_escalation: domain_admin
      ports:
        - 445/tcp
        - 88/tcp

    # 内部路由器
    internal-router:
      kind: linux
      image: frrouting/frr:latest
      labels:
        role: router
        network_layer: [dmz, internal]
        routing: ospf
      sysctls:
        net.ipv4.ip_forward: 1

  links:
    # 外部连接
    - endpoints: ["attacker:eth1", "edge-router:eth1"]

    # DMZ区域内部连接（CVE场景节点间）
    - endpoints: ["edge-router:eth2", "mongodb:eth1"]
    - endpoints: ["mongodb:eth1", "ldap-server:eth1"]
    - endpoints: ["ldap-server:eth1", "unifi-controller:eth1"]

    # 跨区域连接
    - endpoints: ["edge-router:eth3", "internal-router:eth1"]
    - endpoints: ["internal-router:eth2", "domain-controller:eth1"]