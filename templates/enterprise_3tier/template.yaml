name: enterprise_3tier
description: '三层企业网络: DMZ → 应用层 → 数据层，attacker 从 DMZ 入口渗透'
difficulty: medium
transits:
- subnet: 10.255.255.0/30
  endpoints:
  - attacker
  - edge-router
- subnet: 10.255.255.4/30
  endpoints:
  - edge-router
  - app-router
- subnet: 10.255.255.8/30
  endpoints:
  - app-router
  - data-router
zones:
  dmz:
    subnet: 192.168.100.0/24
    type: dmz
    router: edge-router
  app:
    subnet: 10.10.1.0/24
    type: internal
    router: app-router
  data:
    subnet: 10.10.2.0/24
    type: restricted
    router: data-router
routers:
  edge-router:
    image: frrouting/frr:latest
    connects:
    - attacker
    - dmz
  app-router:
    image: frrouting/frr:latest
    connects:
    - dmz
    - app
  data-router:
    image: frrouting/frr:latest
    connects:
    - app
    - data
isolation_rules:
- from: attacker
  to: dmz
  action: accept
- from: attacker
  to: app
  action: deny
- from: attacker
  to: data
  action: deny
- from: dmz
  to: app
  action: accept
- from: app
  to: data
  action: accept
- from: dmz
  to: data
  action: deny
