name: enterprise_4tier
description: "四层企业网络: DMZ → 应用层 → 内部工作站 → 数据层，attacker 需逐层横向移动到达核心数据"
difficulty: hard

transits:
  - subnet: "10.255.255.0/30"
    endpoints: [attacker, edge-router]
  - subnet: "10.255.255.4/30"
    endpoints: [edge-router, app-router]
  - subnet: "10.255.255.8/30"
    endpoints: [app-router, internal-router]
  - subnet: "10.255.255.12/30"
    endpoints: [internal-router, data-router]

zones:
  dmz: {subnet: "192.168.100.0/24", type: dmz, router: edge-router}
  app: {subnet: "10.10.1.0/24", type: internal, router: app-router}
  internal: {subnet: "10.10.2.0/24", type: internal, router: internal-router}
  data: {subnet: "10.10.3.0/24", type: restricted, router: data-router}

routers:
  edge-router: {image: frrouting/frr:latest, connects: [attacker, dmz]}
  app-router: {image: frrouting/frr:latest, connects: [dmz, app]}
  internal-router: {image: frrouting/frr:latest, connects: [app, internal]}
  data-router: {image: frrouting/frr:latest, connects: [internal, data]}

isolation_rules:
  - {from: attacker, to: dmz, action: accept}
  - {from: attacker, to: app, action: deny}
  - {from: attacker, to: internal, action: deny}
  - {from: attacker, to: data, action: deny}
  - {from: dmz, to: app, action: accept}
  - {from: dmz, to: internal, action: deny}
  - {from: dmz, to: data, action: deny}
  - {from: app, to: internal, action: accept}
  - {from: app, to: data, action: deny}
  - {from: internal, to: data, action: accept}

injection_points:
  - id: dmz-web
    zone: dmz
    role_description: "面向公网的 Web 服务入口"
    required_mitre: [initial_access, execution]
    required_vuln_category: [RCE, LFI, SSRF, Deserialization, Auth_Bypass]
    required_service_role: [web_application, middleware, framework]
    count: 1

  - id: app-service
    zone: app
    role_description: "内部应用服务，需从 DMZ 横向移动到达"
    required_mitre: [lateral_movement, execution, persistence]
    required_vuln_category: [RCE, Deserialization, Auth_Bypass, Injection]
    required_service_role: [web_application, middleware, framework]
    count: 1

  - id: internal-workstation
    zone: internal
    role_description: "内部工作站/员工服务，需从应用层继续横向移动到达"
    required_mitre: [lateral_movement, execution, privilege_escalation, credential_access]
    required_vuln_category: [RCE, LPE, Auth_Bypass, Injection, Info_Leak]
    required_service_role: [web_application, middleware, system_service]
    count: 1

  - id: data-store
    zone: data
    role_description: "核心数据存储，最深层的靶标"
    required_mitre: [initial_access, execution, privilege_escalation]
    required_vuln_category: [RCE, LPE, Auth_Bypass, Info_Leak, Injection]
    required_service_role: [database, file_service, system_service]
    count: 1
