name: enterprise_5tier_base
topology:
  nodes:
    attacker:
      kind: linux
      image: clab-agent:latest
    edge-router:
      kind: linux
      image: frrouting/frr:latest
    app-router:
      kind: linux
      image: frrouting/frr:latest
    middleware-router:
      kind: linux
      image: frrouting/frr:latest
    internal-router:
      kind: linux
      image: frrouting/frr:latest
    data-router:
      kind: linux
      image: frrouting/frr:latest
  links:
    - endpoints: ["attacker:eth1", "edge-router:eth1"]
    - endpoints: ["edge-router:eth2", "app-router:eth1"]
    - endpoints: ["app-router:eth2", "middleware-router:eth1"]
    - endpoints: ["middleware-router:eth2", "internal-router:eth1"]
    - endpoints: ["internal-router:eth2", "data-router:eth1"]
