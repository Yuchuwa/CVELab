name: bastion_base
mgmt:
  network: my-mgmt-net
  ipv4-subnet: 10.255.1.0/24
topology:
  nodes:
    attacker:
      kind: linux
      image: clab-agent:latest
    edge-router:
      kind: linux
      image: frrouting/frr:latest
    zone-a-router:
      kind: linux
      image: frrouting/frr:latest
    zone-b-router:
      kind: linux
      image: frrouting/frr:latest
    zone-c-router:
      kind: linux
      image: frrouting/frr:latest
  links:
    - endpoints: ["attacker:eth1", "edge-router:eth1"]
    - endpoints: ["edge-router:eth2", "zone-a-router:eth1"]
    - endpoints: ["edge-router:eth3", "zone-b-router:eth1"]
    - endpoints: ["edge-router:eth4", "zone-c-router:eth1"]
