name: dmz_dual
description: 单层 DMZ 网络，两个不同服务目标，attacker 需分别攻破
difficulty: easy
transits:
- subnet: 10.255.255.0/30
  endpoints:
  - attacker
  - edge-router
zones:
  dmz:
    subnet: 192.168.100.0/24
    type: dmz
    router: edge-router
routers:
  edge-router:
    image: frrouting/frr:latest
    connects:
    - attacker
    - dmz
isolation_rules:
- from: attacker
  to: dmz
  action: accept
noise_levels:
  none: []
  low:
  - name: decoy-dmz-nginx
    zone: dmz
    image: nginx:alpine
    ports:
    - 80
  - name: decoy-dmz-redis
    zone: dmz
    image: redis:7.4-alpine
    ports:
    - 6379
  high:
  - name: decoy-dmz-01
    zone: dmz
    image: nginx:alpine
    ports: &id001
    - 80
  - name: decoy-dmz-02
    zone: dmz
    image: redis:7.4-alpine
    ports: &id002
    - 6379
  - name: decoy-dmz-03
    zone: dmz
    image: alpine:latest
    ports: &id003
    - 3306
    command: nc -lk -p 3306 -e /bin/true
  - name: decoy-dmz-04
    zone: dmz
    image: alpine:latest
    ports: &id004
    - 22
    command: nc -lk -p 22 -e /bin/true
  - name: decoy-dmz-05
    zone: dmz
    image: busybox:latest
    ports: &id005
    - 8080
    command: httpd -f -p 8080
