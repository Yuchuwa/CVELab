name: test-lab-3
topology:
  nodes:
    edge-router:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.0.0.1/24 dev eth1
      - ip addr add 10.0.1.1/24 dev eth2
      - ip route add 10.0.2.0/24 via 10.0.1.2
      sysctls:
        net.ipv4.ip_forward: '1'
    core-router:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.0.1.2/24 dev eth1
      - ip addr add 10.0.2.1/24 dev eth2
      - ip route add 10.0.0.0/24 via 10.0.1.1
      sysctls:
        net.ipv4.ip_forward: '1'
    web-server:
      kind: linux
      image: ubuntu:latest
      exec:
      - apt-get update
      - apt-get install -y iproute2 iputils-ping net-tools
      - ip addr add 10.0.0.64/24 dev eth1
      - ip route replace default via 10.0.0.1
    app-server:
      kind: linux
      image: ubuntu:latest
      exec:
      - apt-get update
      - apt-get install -y iproute2 iputils-ping net-tools
      - ip addr add 10.0.1.64/24 dev eth1
      - ip route replace default via 10.0.1.1
    db-server:
      kind: linux
      image: ubuntu:latest
      exec:
      - apt-get update
      - apt-get install -y iproute2 iputils-ping net-tools
      - ip addr add 10.0.2.64/24 dev eth1
      - ip route replace default via 10.0.2.1
    sw-internal:
      kind: linux
      image: alpine:latest
      sysctls:
        net.ipv4.ip_forward: '1'
      exec:
      - apk add --no-cache bridge-utils
      - brctl addbr br0
      - ip link set dev br0 up
      - brctl addif br0 eth1 && ip link set dev eth1 up
      - brctl addif br0 eth2 && ip link set dev eth2 up
      - brctl addif br0 eth3 && ip link set dev eth3 up
      - ip addr add 10.0.1.2/24 dev br0
  links:
  - endpoints:
    - edge-router:eth1
    - web-server:eth1
  - endpoints:
    - edge-router:eth2
    - sw-internal:eth1
  - endpoints:
    - core-router:eth1
    - sw-internal:eth2
  - endpoints:
    - app-server:eth1
    - sw-internal:eth3
  - endpoints:
    - core-router:eth2
    - db-server:eth1
