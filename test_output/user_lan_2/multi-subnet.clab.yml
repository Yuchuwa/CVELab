name: multi-subnet
topology:
  nodes:
    router:
      kind: linux
      image: alpine:latest
      exec:
      - ip addr add 10.0.0.1/24 dev eth1
      - ip addr add 10.0.1.1/24 dev eth2
      - ip addr add 10.0.2.1/24 dev eth3
      sysctls:
        net.ipv4.ip_forward: '1'
    web-1:
      kind: linux
      image: ubuntu:latest
      exec:
      - apt-get update
      - apt-get install -y iproute2 iputils-ping net-tools
      - ip addr add 10.0.0.64/24 dev eth1
      - ip route replace default via 10.0.0.1
      - ip addr add 10.0.1.64/24 dev eth2
      - ip route replace default via 10.0.1.1
    web-2:
      kind: linux
      image: ubuntu:latest
      exec:
      - apt-get update
      - apt-get install -y iproute2 iputils-ping net-tools
      - ip addr add 10.0.1.65/24 dev eth1
      - ip route replace default via 10.0.1.1
      - ip addr add 10.0.2.64/24 dev eth2
      - ip route replace default via 10.0.2.1
    db-server:
      kind: linux
      image: ubuntu:latest
      exec:
      - apt-get update
      - apt-get install -y iproute2 iputils-ping net-tools
      - ip addr add 10.0.2.65/24 dev eth1
      - ip route replace default via 10.0.2.1
    sw-lan2:
      kind: linux
      image: alpine:latest
      sysctls:
        net.ipv4.ip_forward: '1'
      exec:
      - apk add --no-cache bridge-utils
      - brctl addbr br0
      - ip link set dev br0 up
      - brctl addif br0 eth1 && ip link set dev eth1 up
      - brctl addif br0 eth2 && ip link set dev eth2 up
      - brctl addif br0 eth3 && ip link set dev eth3 up
      - ip addr add 10.0.1.2/24 dev br0
    sw-lan3:
      kind: linux
      image: alpine:latest
      sysctls:
        net.ipv4.ip_forward: '1'
      exec:
      - apk add --no-cache bridge-utils
      - brctl addbr br0
      - ip link set dev br0 up
      - brctl addif br0 eth1 && ip link set dev eth1 up
      - brctl addif br0 eth2 && ip link set dev eth2 up
      - brctl addif br0 eth3 && ip link set dev eth3 up
      - ip addr add 10.0.2.2/24 dev br0
  links:
  - endpoints:
    - router:eth1
    - web-1:eth1
  - endpoints:
    - router:eth2
    - sw-lan2:eth1
  - endpoints:
    - web-1:eth2
    - sw-lan2:eth2
  - endpoints:
    - web-2:eth1
    - sw-lan2:eth3
  - endpoints:
    - router:eth3
    - sw-lan3:eth1
  - endpoints:
    - web-2:eth2
    - sw-lan3:eth2
  - endpoints:
    - db-server:eth1
    - sw-lan3:eth3
