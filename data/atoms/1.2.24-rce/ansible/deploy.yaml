- name: Deploy 1.2.24-rce
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Create network cve-network
    community.docker.docker_network:
      name: cve-network
      state: present
  - name: Start web (vulhub/fastjson:1.2.24)
    community.docker.docker_container:
      name: 1.2.24rce-web
      image: vulhub/fastjson:1.2.24
      state: started
      networks_cli_compatible: true
      networks:
      - name: cve-network
      restart_policy: unless-stopped
      published_ports:
      - 8090:8090
  - name: Wait for web
    ansible.builtin.pause:
      seconds: 10
