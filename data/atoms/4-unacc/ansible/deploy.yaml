- name: Deploy 4-unacc
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Create network cve-network
    community.docker.docker_network:
      name: cve-network
      state: present
  - name: Start redis (vulhub/redis:4.0.14)
    community.docker.docker_container:
      name: 4unacc-redis
      image: vulhub/redis:4.0.14
      state: started
      networks_cli_compatible: true
      networks:
      - name: cve-network
      restart_policy: unless-stopped
      published_ports:
      - 6379:6379
  - name: Wait for redis
    ansible.builtin.pause:
      seconds: 10
