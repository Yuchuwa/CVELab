- name: setup_command app-db-credential
  hosts: localhost
  gather_facts: false
  tasks:
  - name: setup_command app-db-credential
    ansible.builtin.shell: docker exec clab-e3-39838687-6c1a4c244b4836be-target-2
      sh -c 'mkdir -p /run/secrets && printf '"'"'%s'"'"' '"'"'postgres'"'"' > /run/secrets/db-password
      && chmod 0640 /run/secrets/db-password'
    changed_when: false
    register: asset_setup_command_app_db_credential
    until: asset_setup_command_app_db_credential.rc == 0
    retries: 18
    delay: 10
- name: setup_command customer-records
  hosts: localhost
  gather_facts: false
  tasks:
  - name: setup_command customer-records
    ansible.builtin.shell: docker exec clab-e3-39838687-6c1a4c244b4836be-target-3
      sh -c 'PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE
      TABLE IF NOT EXISTS customers (marker text); DELETE FROM customers; INSERT INTO
      customers(marker) VALUES ('"'"'CVELAB-CANARY'"'"');"'
    changed_when: false
    register: asset_setup_command_customer_records
    until: asset_setup_command_customer_records.rc == 0
    retries: 18
    delay: 10
