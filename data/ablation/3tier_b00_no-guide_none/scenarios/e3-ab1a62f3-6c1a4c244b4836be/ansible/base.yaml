- name: Configure data plane network
  hosts: localhost
  gather_facts: false
  tasks:
  - name: 'Configure edge-router: ip addr replace 10.255.255.2/30 dev eth1 && ip link
      set eth1'
    ansible.builtin.shell: '{% raw %}if docker exec -u 0 clab-e3-ab1a62f3-6c1a4c244b4836be-edge-router
      sh -c ''command -v ip >/dev/null 2>&1''; then docker exec -u 0 clab-e3-ab1a62f3-6c1a4c244b4836be-edge-router
      sh -c ''ip addr replace 10.255.255.2/30 dev eth1 && ip link set eth1 up''; else
      sudo -n nsenter -t $(docker inspect -f ''{{.State.Pid}}'' clab-e3-ab1a62f3-6c1a4c244b4836be-edge-router)
      -n sh -c ''ip addr replace 10.255.255.2/30 dev eth1 && ip link set eth1 up'';
