- name: setup_command customer-records
  hosts: localhost
  gather_facts: false
  tasks:
  - name: setup_command customer-records
    ansible.builtin.shell: docker exec clab-e3-b8450c29-2b747f24c2ec1dfb-target-2
      sh -c 'PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE
      TABLE IF NOT EXISTS customers (marker text); DELETE FROM customers; INSERT INTO
      customers(marker) VALUES ('"'"'CVELAB-CANARY'"'"');"'
    changed_when: false
    register: asset_setup_command_customer_records
    until: asset_setup_command_customer_records.rc == 0
    retries: 18
    delay: 10
