- name: Configure data plane network
  hosts: localhost
  gather_facts: false
  tasks:
  - name: 'Configure edge-router: ip link show dev br-dmz-19155 >/dev/null 2>&1 ||
      ip link add'
    ansible.builtin.shell: '{% raw %}if docker exec -u 0 clab-e3-456f9617-2b747f24c2ec1dfb-edge-router
      sh -c ''command -v ip >/dev/null 2>&1''; then docker exec -u 0 clab-e3-456f9617-2b747f24c2ec1dfb-edge-router
      sh -c ''ip link show dev br-dmz-19155 >/dev/null 2>&1 || ip link add name br-dmz-19155
      type bridge''; else sudo -n nsenter -t $(docker inspect -f ''{{.State.Pid}}''
      clab-e3-456f9617-2b747f24c2ec1dfb-edge-router) -n sh -c ''ip link show dev br-dmz-19155
      >/dev/null 2>&1 || ip link add name br-dmz-19155 type bridge''; fi{% endraw
      %}'
    changed_when: false
  - name: 'Configure edge-router: ip addr flush dev eth3 && ip link set eth3 master
      br-dmz-191'
