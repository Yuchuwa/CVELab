name: enterprise_2tier
description: '两层企业网络: DMZ → 数据层，attacker 从 DMZ 入口渗透'
difficulty: easy
transits:
- subnet: 10.255.255.0/30
  endpoints:
  - attacker
  - edge-router
- subnet: 10.255.255.4/30
  endpoints:
  - edge-router
  - data-router
zones:
  dmz:
    subnet: 192.168.100.0/24
    type: dmz
    router: edge-router
  data:
    subnet: 10.10.2.0/24
    type: restricted
    router: data-router
routers:
  edge-router:
    image: frrouting/frr:latest
    connects:
    - attacker
    - dmz
  data-router:
    image: frrouting/frr:latest
    connects:
    - dmz
    - data
isolation_rules:
- from: attacker
  to: dmz
  action: accept
- from: attacker
  to: data
  action: deny
- from: dmz
  to: data
  action: accept
