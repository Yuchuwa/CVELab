- name: verify_command customer-records
  hosts: localhost
  gather_facts: false
  tasks:
  - name: verify_command customer-records
    ansible.builtin.shell: docker exec clab-e3-e5c12f03-c6ce29aa93bb10d1-target-2
      sh -c 'PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -tAc "SELECT
      marker FROM customers WHERE marker='"'"'CVELAB-CANARY'"'"'"'
    changed_when: false
    register: asset_verify_command_customer_records
    until: asset_verify_command_customer_records.rc == 0
    retries: 18
    delay: 10
