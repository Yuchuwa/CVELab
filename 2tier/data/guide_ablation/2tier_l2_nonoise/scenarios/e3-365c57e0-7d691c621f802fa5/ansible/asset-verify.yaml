- name: verify_command customer-records
  hosts: localhost
  gather_facts: false
  tasks:
  - name: verify_command customer-records
    ansible.builtin.shell: docker exec clab-e3-365c57e0-7d691c621f802fa5-target-2
      sh -c 'curl -fsS http://127.0.0.1:9200/customers/customer/1 | grep -Fq '"'"'CVELAB-CANARY'"'"''
    changed_when: false
    register: asset_verify_command_customer_records
    until: asset_verify_command_customer_records.rc == 0
    retries: 18
    delay: 10
